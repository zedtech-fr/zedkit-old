# Caddy serves ./current/site. suggest handles POST /api/identity/suggest.
services:
  suggest:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.mjs"]
    volumes:
      - ./current/suggest:/app:ro
      # The spend ledger and rate counters. They outlive the container, and instances that share this
      # volume share one budget.
      - suggest_data:/data
    env_file:
      - path: current/suggest.env
        required: false
    environment:
      PORT: "3001"
      IDENTITY_AI_STATE_DIR: /data
      IDENTITY_AI_TRUSTED_PROXIES: private
    expose:
      - "3001"
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - suggest
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./current/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./current/site:/srv/site:ro
      - ./site-dev:/srv/site-dev:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  suggest_data:
  caddy_data:
  caddy_config:
