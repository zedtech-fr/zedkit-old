name: ci-dedibox-trial

# Trial only: same heavy CI work as ci.yml on the Dedibox self-hosted
# runner. Does not replace required checks (ci-required) or touch release.
# Fork PRs never use this runner — job `if` requires a same-repo head (or
# a non-pull_request event such as workflow_dispatch).
#
# Persistent host caches (mounted at /runner-cache):
# - pnpm store (content-addressed) + per-lockfile node_modules tarball
#   extracted per job (private inodes; not a shared mutable tree)
# - turbo local cache (TURBO_CACHE_DIR)
# - TypeScript *.tsbuildinfo rolling archive
# - ESLint --cache on the host volume
# Playwright browsers come from the runner image (/opt/ms-playwright).

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-dedibox-trial-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright
  npm_config_store_dir: /runner-cache/pnpm
  npm_config_cache: /runner-cache/npm
  TURBO_CACHE_DIR: /runner-cache/turbo
  # Per-runner ephemeral (compose mounts unique /tmp); shared toolcache races Node installs.
  RUNNER_TOOL_CACHE: /tmp/runner-tool-cache
  XDG_CACHE_HOME: /runner-cache/xdg
  # Bound test/build fan-out so 6+ jobs sharing the 12 CPU slice do not each
  # spawn os.cpus()=32 workers. Not a per-runner cgroup limit.
  TURBO_CONCURRENCY: "4"
  VITEST_MAX_WORKERS: "4"
  VITEST_MAX_FORKS: "4"

jobs:
  # Shared guard: only trusted refs. Same-repo PRs and workflow_dispatch/push.
  # github.repository is "zedtech-fr/zedkit"; a fork PR has a different head.
  checks-dedibox:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, dedibox]
    timeout-minutes: 30
    steps:
      - name: Ensure local cache dirs
        run: bash -c "mkdir -p /runner-cache/{pnpm,nm,tsbuildinfo,eslint,turbo,npm,xdg}"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Restore tsbuildinfo
        run: bash scripts/ci-dedibox-cache.sh restore-ts
      - name: pnpm install (store + nm archive)
        run: bash scripts/ci-dedibox-cache.sh install
      - run: bash scripts/check-deps-audit.sh
      - run: node scripts/check-publish-engines.mjs
      - run: bash scripts/check-registry-ui-drift.sh
      - run: pnpm exec turbo run typecheck lint --cache-dir=/runner-cache/turbo
      - name: Save tsbuildinfo
        if: always()
        run: bash scripts/ci-dedibox-cache.sh save-ts
      - name: ESLint (persistent cache)
        run: pnpm exec eslint . --cache --cache-location /runner-cache/eslint/.eslintcache
      - run: pnpm run catalog:check
      - run: pnpm exec turbo run build --cache-dir=/runner-cache/turbo
      - run: bash scripts/check-api-report.sh
      - name: Docs static export SEO check
        run: node apps/docs/scripts/check-seo-export.mjs
      - name: Docs home first-load JS budget
        run: node apps/docs/scripts/check-first-load-budget.mjs
      - run: bash scripts/check-pack.sh
      - run: bash scripts/check-e2e-registered.sh
      - run: pnpm exec turbo run test --cache-dir=/runner-cache/turbo
      - name: Kit markdown prettier
        run: pnpm --filter @zedtech/zedkit-ai run kit:md
      - name: Coverage (vitest v8)
        run: pnpm test:coverage
      - name: Coverage summary
        if: always()
        run: |
          test -f coverage/coverage-summary.json || exit 0
          node scripts/coverage-summary.mjs coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-dedibox
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
      # deploy/* tests need Docker (Caddyfile/compose) and rsync (deploy/rollback).
      # The Dedibox runner does not mount docker.sock and drops privileges; those
      # tests stay on GitHub-hosted `checks`.
      - name: test:registry (exclude deploy/*)
        run: |
          node --test \
            scripts/registry/*.test.mjs \
            scripts/dts-api-report.test.mjs \
            scripts/check-api-report.test.mjs \
            scripts/catalog-states.test.mjs \
            scripts/catalog-maturity.test.mjs \
            scripts/catalog-adoption.test.mjs \
            scripts/adoption-shown-commands.test.mjs \
            scripts/coverage-summary.test.mjs \
            scripts/release-tags-wait.test.mjs \
            apps/docs/scripts/*.test.mjs
      - name: Playwright browsers (image)
        run: bash scripts/ci-dedibox-cache.sh playwright
      - name: UI gallery screenshot smoke
        run: pnpm --filter @zedtech/zedkit-ui smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-gallery-dedibox
          path: packages/ui/test-results/*.png
          if-no-files-found: ignore
      - run: pnpm run changeset:status
        if: github.head_ref != 'changeset-release/main'
      - name: Cache disk report
        if: always()
        run: bash scripts/ci-dedibox-cache.sh disk-report

  registry-smoke-dedibox:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, dedibox]
    timeout-minutes: 15
    steps:
      - name: Ensure local cache dirs
        run: bash -c "mkdir -p /runner-cache/{pnpm,nm,turbo,npm,eslint,tsbuildinfo}"
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: pnpm install (store + nm archive)
        run: bash scripts/ci-dedibox-cache.sh install
      - run: pnpm registry:build
      # quickstart-smoke.sh runs playwright install --with-deps when CI is set,
      # which needs sudo. no-new-privileges blocks sudo by design; Chromium OS
      # deps and browser binaries are baked into the runner image. Patch the
      # checkout in place so ${CI:+--with-deps} is removed, then run the same
      # three scripts as registry:smoke.
      - name: Playwright browsers (image)
        run: bash scripts/ci-dedibox-cache.sh playwright
      - name: registry smoke (no --with-deps)
        run: |
          sed -i 's/${CI:+--with-deps}//' scripts/quickstart-smoke.sh
          bash scripts/registry/smoke-shadcn-add.sh
          bash scripts/registry/smoke-ui-quickstart.sh
          bash scripts/quickstart-smoke.sh

  docs-smoke-dedibox:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, dedibox]
    timeout-minutes: 20
    steps:
      - name: Ensure local cache dirs
        run: bash -c "mkdir -p /runner-cache/{pnpm,nm,turbo,npm,eslint,tsbuildinfo}"
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: pnpm install (store + nm archive)
        run: bash scripts/ci-dedibox-cache.sh install
      - run: pnpm exec turbo run build --filter=@zedtech/zedkit-docs --cache-dir=/runner-cache/turbo
      - name: Playwright browsers (image)
        run: bash scripts/ci-dedibox-cache.sh playwright
      - run: |
          pnpm dlx serve@14.2.6 apps/docs/out -l 3100 >/tmp/docs-start.log 2>&1 &
          echo $! > /tmp/docs.pid
          for _ in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:3100/ || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          curl -sf http://127.0.0.1:3100/ | grep -q "one prompt away"
          curl -sf -o /dev/null http://127.0.0.1:3100/docs
          curl -sf -o /dev/null http://127.0.0.1:3100/api/search
          curl -sf -o /dev/null http://127.0.0.1:3100/robots.txt
          curl -sf -o /dev/null http://127.0.0.1:3100/sitemap.xml
          curl -sf -o /dev/null http://127.0.0.1:3100/llms.txt
          pnpm --filter @zedtech/zedkit-docs run smoke -- --workers=1 --retries=2
          kill "$(cat /tmp/docs.pid)"
        env:
          DOCS_E2E_PROJECT: chromium
          DOCS_E2E_EXPECT_TIMEOUT: "30000"
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: docs-home-smoke-dedibox
          path: apps/docs/test-results/*.png
          if-no-files-found: ignore

  # Sitemap sweep sharded 3 ways (DOCS_E2E_SHARD*) across parallel Dedibox
  # runners; no needs chain. Tests are split per route so shards stay even.
  docs-e2e-routes-dedibox:
    name: docs-e2e-routes-dedibox (${{ matrix.shard }}/3)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, dedibox]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Ensure local cache dirs
        run: bash -c "mkdir -p /runner-cache/{pnpm,nm,turbo,npm,eslint,tsbuildinfo}"
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: pnpm install (store + nm archive)
        run: bash scripts/ci-dedibox-cache.sh install
      - run: pnpm exec turbo run build --filter=@zedtech/zedkit-docs --cache-dir=/runner-cache/turbo
      - name: Playwright browsers (image)
        run: bash scripts/ci-dedibox-cache.sh playwright
      - run: |
          pnpm dlx serve@14.2.6 apps/docs/out -l 3100 >/tmp/docs-e2e.log 2>&1 &
          echo $! > /tmp/docs-e2e.pid
          for _ in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:3100/ || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          pnpm --filter @zedtech/zedkit-docs run e2e:routes
          kill "$(cat /tmp/docs-e2e.pid)"
        env:
          DOCS_E2E_PROJECT: chromium
          DOCS_E2E_SHARD: ${{ matrix.shard }}
          DOCS_E2E_SHARD_TOTAL: "3"
