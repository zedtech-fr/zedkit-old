name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

# One group per PR (or per ref on push). Cancel only superseded pull_request
# runs — never a push to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # When a PR touches only workflow YAML or .github/*.md, heavy jobs skip and
  # ci-required accepts that only if this job sets workflow_only=true.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      workflow_only: ${{ steps.detect.outputs.workflow_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect workflow-only diff
        id: detect
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          else
            base="HEAD~1"
          fi
          mapfile -t files < <(git diff --name-only "$base"...HEAD)
          workflow_only=true
          for f in "${files[@]}"; do
            case "$f" in
              .github/workflows/*|.github/*.md) ;;
              *) workflow_only=false; break ;;
            esac
          done
          echo "workflow_only=$workflow_only" >> "$GITHUB_OUTPUT"

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.workflow_only == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: actionlint and yamllint on changed workflow files
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          else
            base="HEAD~1"
          fi
          mapfile -t files < <(git diff --name-only "$base"...HEAD -- '.github/workflows/')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No workflow files in diff; skipping actionlint/yamllint."
            exit 0
          fi
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.10/actionlint_1.7.10_linux_amd64.tar.gz | tar xz
          ./actionlint "${files[@]}"
          python3 -m pip install --disable-pip-version-check yamllint==1.35.1
          yamllint -d "{extends: default, rules: {line-length: disable, truthy: disable}}" "${files[@]}"

  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check-no-artifacts.sh
      - run: bash scripts/check-no-private-refs.sh
      - run: bash scripts/check-tone.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/check-dependabot.sh
      - run: bash scripts/check-breaking-changeset.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/check-changeset-packages.sh
      - run: bash scripts/check-pr-lenses.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.workflow_only != 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          # changeset status diffs against origin/main (see baseBranch in
          # .changeset/config.json); a shallow clone, or no local main
          # branch, breaks it.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/check-deps-audit.sh
      - run: node scripts/check-publish-engines.mjs
      - run: bash scripts/check-registry-ui-drift.sh
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      # Sequential phases: build output is read by later phases.
      - run: pnpm exec turbo run typecheck lint
      # Smoke-test the shared ESLint config itself: with zero packages turbo
      # runs no lint task, so a broken config would otherwise stay green.
      - run: pnpm exec eslint .
      - run: pnpm run catalog:check
      - run: pnpm exec turbo run build
      - run: bash scripts/check-api-report.sh
      - name: Docs static export SEO check
        run: node apps/docs/scripts/check-seo-export.mjs
      - name: Docs home first-load JS budget
        run: node apps/docs/scripts/check-first-load-budget.mjs
      - run: bash scripts/check-pack.sh
      - run: bash scripts/check-e2e-registered.sh
      - run: pnpm exec turbo run test
      - name: Kit markdown prettier
        run: pnpm --filter @zedtech/zedkit-ai run kit:md
      - name: Coverage (vitest v8)
        run: pnpm test:coverage
      - name: Coverage summary
        if: always()
        run: |
          test -f coverage/coverage-summary.json || exit 0
          node scripts/coverage-summary.mjs coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
      - run: pnpm test:registry
      # Gallery smoke: real chromium over the built ui gallery (both
      # themes, zero console errors), screenshots kept as artifacts.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @zedtech/zedkit-ui smoke
      - uses: actions/upload-artifact@v7
        with:
          name: ui-gallery
          path: packages/ui/test-results/*.png
      # Versioning dry-run only: proves the Changesets metadata is sane.
      # Skipped on the Version PR itself: it consumed the changesets, so
      # `status` always reports "changed packages, no changesets" there.
      - run: pnpm run changeset:status
        if: github.head_ref != 'changeset-release/main'

  registry-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.workflow_only != 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm registry:build
      - run: pnpm registry:smoke

  quickstart-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.workflow_only != 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@zedtech/zedkit-ui
      - run: pnpm registry:build
      - run: bash scripts/quickstart-smoke.sh

  # Follows the adoption instructions the site shows (home, getting-started, component pages), and nothing else,
  # in clean Next.js projects: install Button, copy Button and Drawer by CLI and by hand, Theme, Motion, the
  # getting-started package adds, plus a negative control that must fail. Not in ci-required until it has been
  # stable on main for a while.
  adoption-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.workflow_only != 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm registry:build
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm adoption:smoke

  docs-e2e-shard:
    name: docs-e2e-shard (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: changes
    if: needs.changes.outputs.workflow_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@zedtech/zedkit-docs
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: |
          pnpm dlx serve@14.2.6 apps/docs/out -l 3100 >/tmp/docs-e2e.log 2>&1 &
          echo $! > /tmp/docs-e2e.pid
          for _ in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:3100/ || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          pnpm --filter @zedtech/zedkit-docs run e2e
          kill "$(cat /tmp/docs-e2e.pid)"
        env:
          DOCS_E2E_PROJECT: chromium
          DOCS_E2E_SHARD: ${{ matrix.shard }}
          DOCS_E2E_SHARD_TOTAL: "3"

  # Sitemap sweep (100+ routes × axe views) lives outside the shards: it alone
  # can exceed a 20-minute job since #1203 grew the route list and e2e count.
  docs-e2e-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.workflow_only != 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@zedtech/zedkit-docs
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: |
          pnpm dlx serve@14.2.6 apps/docs/out -l 3100 >/tmp/docs-e2e.log 2>&1 &
          echo $! > /tmp/docs-e2e.pid
          for _ in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:3100/ || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          pnpm --filter @zedtech/zedkit-docs run e2e:routes
          kill "$(cat /tmp/docs-e2e.pid)"
        env:
          DOCS_E2E_PROJECT: chromium

  # Required check name stays `docs-e2e`: one gate over the three shards.
  docs-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, docs-e2e-shard, docs-e2e-routes]
    if: always() && needs.changes.outputs.workflow_only != 'true'
    steps:
      - name: All shards passed
        run: |
          test "${{ needs.docs-e2e-shard.result }}" = "success"
          test "${{ needs.docs-e2e-routes.result }}" = "success"

  docs-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.workflow_only != 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Scoped build (turbo builds workspace deps first), then serve the
      # static export (apps/docs/out, same files Caddy serves in prod)
      # and prove the home renders with live demos.
      - run: pnpm exec turbo run build --filter=@zedtech/zedkit-docs
      - run: pnpm exec playwright install --with-deps chromium
      - run: |
          pnpm dlx serve@14.2.6 apps/docs/out -l 3100 >/tmp/docs-start.log 2>&1 &
          echo $! > /tmp/docs.pid
          for _ in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:3100/ || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          curl -sf http://127.0.0.1:3100/ | grep -q "one prompt away"
          curl -sf -o /dev/null http://127.0.0.1:3100/docs
          curl -sf -o /dev/null http://127.0.0.1:3100/api/search
          curl -sf -o /dev/null http://127.0.0.1:3100/robots.txt
          curl -sf -o /dev/null http://127.0.0.1:3100/sitemap.xml
          curl -sf -o /dev/null http://127.0.0.1:3100/llms.txt
          pnpm --filter @zedtech/zedkit-docs run smoke
          kill "$(cat /tmp/docs.pid)"
        env:
          DOCS_E2E_PROJECT: chromium
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: docs-home-smoke
          path: apps/docs/test-results/*.png
          if-no-files-found: ignore

  # Stable check name for branch protection. Require this one job instead of
  # listing every CI job (and the docs-e2e shard names). The ruleset still
  # lists the old names until an admin applies the settings issue.
  ci-required:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, hygiene, workflow-lint, checks, registry-smoke, docs-e2e, docs-smoke]
    if: always()
    steps:
      - name: All required jobs passed
        env:
          CHANGES: ${{ needs.changes.result }}
          WORKFLOW_ONLY: ${{ needs.changes.outputs.workflow_only }}
          HYGIENE: ${{ needs.hygiene.result }}
          WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
          CHECKS: ${{ needs.checks.result }}
          REGISTRY: ${{ needs.registry-smoke.result }}
          DOCS_E2E: ${{ needs.docs-e2e.result }}
          DOCS_SMOKE: ${{ needs.docs-smoke.result }}
        run: |
          test "$CHANGES" = "success"
          test "$HYGIENE" = "success"
          if [ "$WORKFLOW_ONLY" = "true" ]; then
            test "$WORKFLOW_LINT" = "success"
            test "$CHECKS" = "skipped"
            test "$REGISTRY" = "skipped"
            test "$DOCS_E2E" = "skipped"
            test "$DOCS_SMOKE" = "skipped"
          else
            test "$WORKFLOW_LINT" = "skipped"
            test "$CHECKS" = "success"
            test "$REGISTRY" = "success"
            test "$DOCS_E2E" = "success"
            test "$DOCS_SMOKE" = "success"
          fi
